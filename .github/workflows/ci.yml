# CHANGED: new workflow. Previously the only CI was the weekly pg_dump backup,
# so `npm run test` never ran on push — the existing tests guarded nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # prisma generate needs DATABASE_URL to be parseable, not reachable.
      # No secret required — nothing here connects to the database.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      # CHANGED: placeholders so `next build` can compile. Every page in this app is
      # dynamic (server-rendered on demand), so the build never renders a page and
      # never calls Clerk — it only needs the publishable key to PARSE. The value is
      # the documented pk_test_<base64 of a host> shape; it is not a credential and
      # grants nothing. Verified locally: the build succeeds with exactly these.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk"
      CLERK_SECRET_KEY: "sk_test_ci_placeholder_not_a_real_key"
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # `npm install`, not `npm ci`: npm on macOS does not record the
        # Linux-only optional packages that vitest's rolldown dependency needs
        # (@emnapi/core, @emnapi/runtime), so `npm ci` fails the strict
        # lockfile match on the Linux runner. `npm install` resolves them at
        # install time. A few seconds slower, same result for testing.
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        # Catches the type-drift class of bug (a stale types/index.ts silently
        # disagreeing with the schema). Runs without any Clerk/DB secrets.
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        # CHANGED: the production build now runs in CI. tsc does not catch everything
        # `next build` does — the `[...new Set()]` downlevelIteration error broke the
        # Vercel build more than once and typechecks clean. Pushing to main deploys
        # straight to production, so this is the last gate before a real outage.
        run: npm run build
